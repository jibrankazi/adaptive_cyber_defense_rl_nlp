name: CI - Adaptive Cyber Defense (prototype validation)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run smoke tests
        run: python -m pytest -q tests/test_smoke.py
      - name: Run documented prototype
        run: |
          python src/train_nlp.py --epochs 1
          python src/train_rl.py --config configs/dqn.yaml
          python src/evaluate.py
      - name: Validate prototype report
        run: |
          python -c "import json; r=json.load(open('results/report.json')); assert r['rl_episodes'] > 0; assert 0 <= r['nlp_f1'] <= 1"
